# 🔧 Nginx Configuration for Mendora Travels API
# File location: /etc/nginx/sites-available/api.mendoratravels.com

# Upstream Node.js server
upstream mendora_api {
    server 127.0.0.1:7000;
    keepalive 64;
}

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.mendoratravels.com;
    
    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mendoratravels.com;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.mendoratravels.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mendoratravels.com/privkey.pem;
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 🚀 Request body size limits for multi-image uploads
    # Allows ~10-15 images at 2-3MB each
    client_max_body_size 30M;  # Total request size
    client_body_buffer_size 5M;
    client_body_timeout 120s;   # 2 minutes for uploads

    # Logging
    access_log /var/log/nginx/api.mendoratravels.com.access.log;
    error_log /var/log/nginx/api.mendoratravels.com.error.log warn;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/xml+rss application/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # CORS Headers (handled by Express, but backup here)
    add_header 'Access-Control-Allow-Origin' 'https://mendoratravels.com' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'https://mendoratravels.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Max-Age' 3600;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Proxy to Node.js
    location / {
        proxy_pass http://mendora_api;
        proxy_http_version 1.1;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Forward real client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for large uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffer settings for large uploads
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Disable cache for API calls
        proxy_cache_bypass $http_upgrade;
    }

    # Health check endpoint (optional optimization)
    location /health {
        proxy_pass http://mendora_api/health;
        access_log off;
    }

    # API documentation (if you have Swagger/OpenAPI)
    location /api-docs {
        proxy_pass http://mendora_api/api-docs;
    }
}
